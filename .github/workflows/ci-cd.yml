name: EventEase CI/CD Pipeline

# 🚀 Déclenchement automatique
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Permet déclenchement manuel

# Variables d'environnement globales
env:
  JAVA_VERSION: '17'
  NODE_VERSION: '18'
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/eventease-backend

jobs:
  # ========================================
  # 🏗️ STAGE 1: BUILD & TEST
  # ========================================
  build-and-test:
    name: Build & Test Backend
    runs-on: ubuntu-latest
    
    steps:
      # 📥 Checkout du code
      - name: Checkout code
        uses: actions/checkout@v4
      
      # ☕ Configuration Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'
      
      # 🔍 Afficher les informations système
      - name: Display system info
        run: |
          echo "🖥️ Runner OS: ${{ runner.os }}"
          echo "☕ Java version:"
          java -version
          echo "📦 Maven version:"
          ./EventEase/backend/mvnw --version
      
      # 🏗️ Compilation du projet
      - name: Build with Maven
        working-directory: ./EventEase/backend
        run: |
          echo "🏗️ Compilation du backend..."
          ./mvnw clean compile -DskipTests
      
      # 🧪 Exécution des tests avec Testcontainers
      - name: Run tests with Testcontainers
        working-directory: ./EventEase/backend
        run: |
          echo "🧪 Exécution des tests d'intégration..."
          ./mvnw test
      
      # 📊 Génération du rapport de tests
      - name: Generate test report
        if: always()
        working-directory: ./EventEase/backend
        run: |
          echo "📊 Génération du rapport de tests..."
          ./mvnw surefire-report:report-only
      
      # 📤 Upload des résultats de tests
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            EventEase/backend/target/surefire-reports/
            EventEase/backend/target/site/
          retention-days: 30
      
      # 📦 Package de l'application
      - name: Package application
        working-directory: ./EventEase/backend
        run: |
          echo "📦 Création du JAR..."
          ./mvnw package -DskipTests
      
      # 📤 Upload du JAR artifact
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: eventease-backend-jar
          path: EventEase/backend/target/*.jar
          retention-days: 7

  # ========================================
  # 🐳 STAGE 2: DOCKER BUILD
  # ========================================
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/pro403-6-bdd')
    
    steps:
      # 📥 Checkout du code
      - name: Checkout code
        uses: actions/checkout@v4
      
      # 🐳 Configuration Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      # 🔐 Login au GitHub Container Registry
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      # 🏷️ Extraction des métadonnées Docker
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
      
      # 🏗️ Build et Push de l'image Docker
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./EventEase/backend
          file: ./EventEase/backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      # ✅ Afficher les tags créés
      - name: Display created tags
        run: |
          echo "🏷️ Images Docker créées:"
          echo "${{ steps.meta.outputs.tags }}"

  # ========================================
  # 🚀 STAGE 3: DEPLOY
  # ========================================
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/pro403-6-bdd'
    environment:
      name: production
    
    steps:
      # 📥 Checkout du code
      - name: Checkout code
        uses: actions/checkout@v4
      
      # 🔐 Configuration SSH
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts
      
      # 📤 Copie des fichiers de déploiement
      - name: Copy deployment files
        run: |
          echo "📤 Copie des fichiers vers le serveur..."
          scp -i ~/.ssh/id_rsa \
            EventEase/backend/docker-compose.yml \
            EventEase/backend/.env \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:~/eventease/
      
      # 🚀 Déploiement sur le serveur
      - name: Deploy on server
        run: |
          echo "🚀 Déploiement de l'application..."
          ssh -i ~/.ssh/id_rsa ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            cd ~/eventease
            
            # Login au registry
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.DOCKER_REGISTRY }} -u ${{ github.actor }} --password-stdin
            
            # Pull de la nouvelle image
            docker compose pull
            
            # Redémarrage des services
            docker compose down
            docker compose up -d
            
            # Vérification du statut
            docker compose ps
            
            # Nettoyage des anciennes images
            docker image prune -f
          EOF
      
      # 🏥 Health check
      - name: Health check
        run: |
          echo "🏥 Vérification de la santé de l'application..."
          sleep 10
          curl -f http://${{ secrets.SERVER_HOST }}:9020/health || exit 1
          echo "✅ Application déployée avec succès!"
      
      # 📧 Notification de succès
      - name: Deployment success notification
        if: success()
        run: |
          echo "✅ Déploiement réussi!"
          echo "🌐 Application disponible sur: http://${{ secrets.SERVER_HOST }}:9020"

  # ========================================
  # 📊 STAGE 4: QUALITY & SECURITY
  # ========================================
  code-quality:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
      # 📥 Checkout du code
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Pour SonarQube
      
      # ☕ Configuration Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'
      
      # 🔍 Analyse de sécurité des dépendances
      - name: Dependency security check
        working-directory: ./EventEase/backend
        run: |
          echo "🔍 Vérification des vulnérabilités..."
          ./mvnw dependency-check:check || true
      
      # 📊 Génération du rapport de couverture
      - name: Generate coverage report
        working-directory: ./EventEase/backend
        run: |
          echo "📊 Génération du rapport de couverture..."
          ./mvnw test jacoco:report
      
      # 📤 Upload du rapport de couverture
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: EventEase/backend/target/site/jacoco/
          retention-days: 30

# ========================================
# 📋 Résumé de la Pipeline
# ========================================
# 
# 1. BUILD & TEST
#    - Compilation Maven
#    - Tests d'intégration avec Testcontainers
#    - Génération de rapports
# 
# 2. DOCKER BUILD
#    - Construction de l'image Docker
#    - Push vers GitHub Container Registry
#    - Tagging automatique
# 
# 3. DEPLOY
#    - Déploiement SSH sur serveur distant
#    - Docker Compose up
#    - Health check
# 
# 4. QUALITY & SECURITY
#    - Analyse de sécurité
#    - Rapport de couverture
# 
# ========================================
