name: EventEase Backend CI/CD

# 🚀 تحديد متى يتم تشغيل الـ pipeline
on:
  push:                         # عند كل عملية "push"
    branches: [ "main", "develop" ]   # على الفروع الرئيسية فقط
  pull_request:                 # أو عند فتح pull request
    branches: [ "main" ]

# 🌍 متغيرات عامة تُستخدم في جميع المراحل
env:
  JAVA_VERSION: '17'            # إصدار الجافا المستخدم
  IMAGE_NAME: eventease-backend # اسم الصورة (image) في Docker

jobs:
  # ========================================
  # 🏗️ المرحلة الأولى: البناء (BUILD)
  # ========================================
  build:
    runs-on: ubuntu-latest      # يشتغل على نظام Ubuntu في GitHub Actions
    
    steps:
      # 🔽 1. جلب الكود من المستودع
      - name: Checkout repository
        uses: actions/checkout@v4
      
      # ☕ 2. إعداد بيئة الجافا (JDK 17)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin' # توزيعة مفتوحة المصدر من Java
          cache: 'maven'          # تفعيل الكاش لتسريع البناء
      
      # 🧱 3. بناء المشروع باستخدام Maven بدون تشغيل الاختبارات
      - name: Build with Maven
        working-directory: ./EventEase/backend
        run: |
          ./mvnw clean package -DskipTests
      
      # 📦 4. رفع ملف الـ JAR الناتج كـ artifact لاستخدامه لاحقًا
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: eventease-backend-jar
          path: EventEase/backend/target/*.jar

  # ========================================
  # 🧪 المرحلة الثانية: الاختبارات (TEST)
  # ========================================
  test:
    runs-on: ubuntu-latest      # يشتغل على Ubuntu
    needs: build                # يعتمد على نجاح مرحلة الـ build
    
    services:
      # 🗄️ خدمة MongoDB تُشغل داخل الحاوية (Docker container)
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      # 🔽 1. جلب الكود من المستودع
      - name: Checkout repository
        uses: actions/checkout@v4
      
      # ☕ 2. إعداد الجافا
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'
      
      # 📥 3. تنزيل ملف الـ JAR الناتج من مرحلة الـ build
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: eventease-backend-jar
          path: ./EventEase/backend/target
      
      # 🧪 4. تشغيل اختبارات التكامل (integration tests)
      - name: Run integration tests
        working-directory: ./EventEase/backend
        run: |
          ./mvnw test
        env:
          SPRING_DATA_MONGODB_URI: mongodb://localhost:27017/eventease_test
      
      # 📊 5. رفع تقارير النتائج إلى GitHub Actions (للرجوع إليها لاحقًا)
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: EventEase/backend/target/surefire-reports/
          retention-days: 30

  # ========================================
  # 🚀 المرحلة الثالثة: النشر (DEPLOY)
  # ========================================
  deploy:
    runs-on: self-hosted        # يشتغل على السيرفر المحلي (runner)
    needs: test                 # يعتمد على نجاح مرحلة الاختبار
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    
    steps:
      # 🔽 1. جلب الكود مرة أخرى
      - name: Checkout repository
        uses: actions/checkout@v4
      
      # 🔐 2. التأكد من وجود جميع الأسرار (Secrets)
      - name: Verify secrets are set
        run: |
          if [ -z "${{ secrets.MONGODB_URI }}" ]; then
            echo "❌ MONGODB_URI secret is not set!"
            exit 1
          fi
          if [ -z "${{ secrets.JWT_SECRET }}" ]; then
            echo "❌ JWT_SECRET secret is not set!"
            exit 1
          fi
          echo "✅ All required secrets are configured"
      
      # 🐳 3. بناء الصورة Docker وتشغيل التطبيق داخلها
      - name: Build, Tag, and Deploy with Version
        working-directory: ./EventEase/backend
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DATABASE: ${{ secrets.MONGODB_DATABASE }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          # 🔹 قراءة رقم الإصدار من ملف pom.xml
          APP_VERSION=$(grep -m 1 '<version>' pom.xml | grep -v 'parent' | sed -e 's/.*<version>\(.*\)<\/version>.*/\1/' | xargs)
          if [ -z "$APP_VERSION" ]; then
            APP_VERSION=$(sed -n '/<artifactId>backend<\/artifactId>/,/<\/version>/p' pom.xml | grep '<version>' | sed -e 's/.*<version>\(.*\)<\/version>.*/\1/' | xargs)
          fi
          IMAGE_NAME="${{ env.IMAGE_NAME }}"
          
          echo "🚀 نشر النسخة رقم: $APP_VERSION"
          
          # 🧹 إيقاف وإزالة أي حاوية قديمة بنفس الاسم
          docker stop $IMAGE_NAME 2>/dev/null || true
          docker rm $IMAGE_NAME 2>/dev/null || true
          
          # 🧱 بناء صورة Docker جديدة بالإصدار الحالي
          docker build -t ${IMAGE_NAME}:${APP_VERSION} .
          docker tag ${IMAGE_NAME}:${APP_VERSION} ${IMAGE_NAME}:latest
          
          # ▶️ تشغيل التطبيق داخل الحاوية الجديدة
          CONTAINER_ID=$(docker run -d \
            --name $IMAGE_NAME \
            -p 8080:8080 \
            -e SPRING_DATA_MONGODB_URI="${MONGODB_URI}" \
            -e SPRING_DATA_MONGODB_DATABASE="${MONGODB_DATABASE}" \
            -e JWT_SECRET="${JWT_SECRET}" \
            -e SERVER_PORT=8080 \
            ${IMAGE_NAME}:${APP_VERSION})
          
          echo "✅ التطبيق يعمل داخل الحاوية ID: $CONTAINER_ID"
          
          # ⏳ الانتظار قليلاً قبل الفحص
          echo "⏳ الانتظار لتأكيد التشغيل..."
          sleep 15
          
          # 🔍 التحقق من أن الحاوية تعمل فعلاً
          if ! docker ps | grep -q $IMAGE_NAME; then
            echo "❌ فشل تشغيل الحاوية! عرض السجلات:"
            docker logs $IMAGE_NAME
            exit 1
          fi
          
          # 📜 عرض آخر 20 سطر من السجلات
          echo "📜 آخر السجلات:"
          docker logs $IMAGE_NAME | tail -20
          
          echo "🎉 تم النشر بنجاح!"
      
      # 🧼 4. تنظيف الصور القديمة لتوفير مساحة
      - name: Clean up old images
        run: |
          docker image prune -f

# ========================================
# 📋 ملخص الـ Pipeline
# ========================================
# 
# 🏗️ BUILD
#    - بناء المشروع وإنشاء JAR
# 
# 🧪 TEST
#    - تشغيل الاختبارات باستخدام MongoDB
# 
# 🚀 DEPLOY
#    - بناء الصورة Docker وتشغيلها على السيرفر
#    - بدون نسخ الكود المصدري إلى السيرفر
# 
# ========================================
# 
# 🔑 Secrets المطلوبة:
# - MONGODB_URI: رابط قاعدة البيانات
# - MONGODB_DATABASE: اسم القاعدة
# - JWT_SECRET: مفتاح JWT السري
# 
# ========================================
