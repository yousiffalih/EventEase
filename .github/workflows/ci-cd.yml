name: EventEase Backend CI/CD

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

env:
  JAVA_VERSION: '17'
  IMAGE_NAME: eventease-backend

jobs:
  # ========================================
  # 🏗️ BUILD JOB
  # ========================================
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Build with Maven
        working-directory: ./EventEase/backend
        run: |
          ./mvnw clean package -DskipTests
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: eventease-backend-jar
          path: EventEase/backend/target/*.jar

  # ========================================
  # 🧪 TEST JOB
  # ========================================
  test:
    runs-on: ubuntu-latest
    needs: build
    
    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: eventease-backend-jar
          path: ./EventEase/backend/target
      
      - name: Run integration tests
        working-directory: ./EventEase/backend
        run: |
          ./mvnw test
        env:
          SPRING_DATA_MONGODB_URI: mongodb://localhost:27017/eventease_test
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: EventEase/backend/target/surefire-reports/
          retention-days: 30

  # ========================================
  # 🚀 DEPLOY JOB
  # ========================================
  deploy:
    runs-on: self-hosted
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Verify secrets are set
        run: |
          if [ -z "${{ secrets.MONGODB_URI }}" ]; then
            echo "❌ MONGODB_URI secret is not set!"
            exit 1
          fi
          if [ -z "${{ secrets.JWT_SECRET }}" ]; then
            echo "❌ JWT_SECRET secret is not set!"
            exit 1
          fi
          echo "✅ All required secrets are configured"
      
      - name: Build, Tag, and Deploy with Version
        working-directory: ./EventEase/backend
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DATABASE: ${{ secrets.MONGODB_DATABASE }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          # 1. Read the version from pom.xml (skip parent version)
          APP_VERSION=$(grep -m 1 '<version>' pom.xml | grep -v 'parent' | sed -e 's/.*<version>\(.*\)<\/version>.*/\1/' | xargs)
          if [ -z "$APP_VERSION" ]; then
            APP_VERSION=$(sed -n '/<artifactId>backend<\/artifactId>/,/<\/version>/p' pom.xml | grep '<version>' | sed -e 's/.*<version>\(.*\)<\/version>.*/\1/' | xargs)
          fi
          IMAGE_NAME="${{ env.IMAGE_NAME }}"
          
          echo "Deploying version: $APP_VERSION"
          
          # 2. Stop and remove the old container (if it exists)
          docker stop $IMAGE_NAME 2>/dev/null || true
          docker rm $IMAGE_NAME 2>/dev/null || true
          
          # 3. Build the new Docker image with version tag
          docker build -t ${IMAGE_NAME}:${APP_VERSION} .
          docker tag ${IMAGE_NAME}:${APP_VERSION} ${IMAGE_NAME}:latest
          
          # 4. Start the new container with environment variables
          CONTAINER_ID=$(docker run -d \
            --name $IMAGE_NAME \
            -p 8080:8080 \
            -e SPRING_DATA_MONGODB_URI="${MONGODB_URI}" \
            -e SPRING_DATA_MONGODB_DATABASE="${MONGODB_DATABASE}" \
            -e JWT_SECRET="${JWT_SECRET}" \
            -e SERVER_PORT=8080 \
            ${IMAGE_NAME}:${APP_VERSION})
          
          echo "Container started with ID: $CONTAINER_ID"
          
          # 5. Wait for container to be healthy
          echo "Waiting for application to start..."
          sleep 15
          
          # 6. Check if container is still running
          if ! docker ps | grep -q $IMAGE_NAME; then
            echo "❌ Container failed to start! Logs:"
            docker logs $IMAGE_NAME
            exit 1
          fi
          
          # 7. Check application logs
          echo "Application logs:"
          docker logs $IMAGE_NAME | tail -20
          
          echo "✅ Deployment successful!"
      
      - name: Clean up old images
        run: |
          docker image prune -f

# ========================================
# 📋 Pipeline Summary
# ========================================
# 
# 1. BUILD
#    - Compile with Maven
#    - Create JAR artifact
# 
# 2. TEST
#    - Run integration tests with MongoDB service
#    - Upload test results
# 
# 3. DEPLOY (self-hosted runner)
#    - Create environment file with secrets
#    - Build Docker image with version from pom.xml
#    - Stop old container, start new one
#    - Clean up old images
# 
# ========================================
# 
# Required GitHub Secrets:
# - MONGODB_URI: MongoDB connection string
# - MONGODB_DATABASE: Database name
# - JWT_SECRET: JWT secret key
# 
# ========================================
